\u003c/span>\u003c/span>\u003c/div>\u003c/div>","k":"yhzkgjqzkr"},{"p":3,"s":"Trong năm nay, một cửa hàng kinh doanh xe máy dự định kinh doanh hai loại xe máy: xe máy Lead và xe máy Vision, với số vốn ban đầu không vượt quá \\(36\\) tỉ đồng. Giá nhập về 1 chiếc xe máy Lead là \\(40\\) triệu đồng, lợi nhuận dự kiến là \\(5\\) triệu đồng một chiếc. Giá nhập về 1 chiếc xe máy Vision là \\(30\\) triệu đồng, lợi nhuận dự kiến là \\(3{,}2\\) triệu đồng một chiếc. Cửa hàng ước tính rằng tổng nhu cầu thị trường không vượt quá \\(1100\\) chiếc xe cả hai loại và nhu cầu xe Lead không vượt quá \\(1{,}5\\) lần nhu cầu xe Vision.\r Lợi nhuận có thể thu được lớn nhất của cửa hàng là bao nhiêu tiền? Viết câu trả lời theo đơn vị tỉ đồng.","k":"1lu9gx1mhr5"},{"p":3,"s":"Một công ty TNHH trong một đợt quảng cáo và bán hàng khuyến mại hàng hóa (một sản phẩm mới của công ty) cần thuê xe để chở \\(140\\) người và \\(9\\) tấn hàng. Nơi thuê chỉ có hai loại xe A và B.\r Trong đó xe loại A có \\(10\\) chiếc, xe loại B có \\(9\\) chiếc. Một chiếc xe loại A cho thuê với giá \\(4\\) triệu, loại B giá \\(3\\) triệu. Biết rằng xe A chỉ chở tối đa \\(20\\) người và \\(0{,}6\\) tấn hàng; xe B chở tối đa \\(10\\) người và \\(1{,}5\\) tấn hàng. Hỏi phải thuê tất cả bao nhiêu xe để chi phí vận chuyển là thấp nhất?","k":"1bkehd4q0yx"},{"p":3,"s":"Cho tam giác \\(A B C\\) có \\(a=8,\\) \\(c=3,\\) \\(B=60^{\\circ}\\). Độ dài cạnh \\(b\\) bằng bao nhiêu?","k":"1w5bkscwpb2"},{"p":3,"s":"Hai bạn An và Bình cùng xuất phát từ điểm \\(P\\), đi theo hai hướng khác nhau và tạo với nhau một góc \\(40^\\circ\\) để đến đích là điểm \\(D\\), \\(\\widehat{PAD} = 100^\\circ\\). Biết rằng họ dừng lại để ăn trưa lần lượt tại \\(A\\) và \\(B\\) (như hình vẽ minh họa). Hỏi bạn Bình phải đi bao bao nhiêu km nữa nữa để đến được đích (làm tròn đến 1 chữ số sau dấu thập phân)? \u003cdiv class=\"c\"> \u003cspan class=\"fz\" data-w=\"300\">\u003cimg class=\"fig\" src=\"data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0nMS4wJyBlbmN if(pend()&&C.gas){var pn=$('.card');if(pn){var m=document.createElement('div');m.className='msg';m.id='sent';m.textContent='Có một bài đã nộp chưa gửi được điểm. Đang gửi lại…';pn.insertBefore(m,pn.children[1]);flush()}}
$('#go').onclick=function(){var n=$('#nm').value.trim().replace(/\s+/g,' '),c=$('#cl')?$('#cl').value.trim().replace(/\s+/g,' ').toUpperCase():'';
if(n.length<2||(C.need_class&&!c)){var e=$('#err');e.textContent='Hãy nhập đủ họ tên'+(C.need_class?' và lớp':'')+'.';e.classList.remove('hide');return}
try{localStorage.setItem('quizname',JSON.stringify({n:n,c:c}))}catch(e){}
var seed=Math.floor(Math.random()*900000)+100000;S={name:n,cls:c,seed:seed,start:Date.now(),ans:{},done:false,sid:newId()};save();run()}}
function run(){done=false;var o=order(S.seed),a=$('#app');var nav='',body='',cur=0,last=0;
o.ord.forEach(function(qi,k){var q=Q[qi];if(q.p!==last){last=q.p;body+='<h2>'+NAMES[q.p]+'</h2><div class="mut">'+HINT[q.p]+'</div>';nav+='<span class="mut" style="align-self:center;margin-left:6px">'+['','I','II','III'][q.p]+'</span>'}
cur++;nav+='<a href="#q'+qi+'" id="n'+qi+'">'+cur+'</a>';
body+='<div class="card q" id="q'+qi+'"><div><span class="qn">Câu '+cur+'.</span> '+q.s+'</div>';
if(q.p===1){o.co[qi].forEach(function(ci,j){body+='<div class="opt" data-q="'+qi+'" data-v="'+ci+'"><span class="l">'+'ABCD'[j]+'.</span><span class="x">'+q.c[ci]+'</span></div>'})}
else if(q.p===2){o.co[qi].forEach(function(ci,j){body+='<div class="tf"><div><b>'+'abcd'[j]+')</b> '+q.c[ci]+'</div><div class="yn" data-q="'+qi+'" data-c="'+ci+'"><span data-v="Đ">Đúng</span><span data-v="S">Sai</span></div></div>'})}
else body+='<p><input type="text" class="sh" data-q="'+qi+'" placeholder="Đáp án" autocomplete="off"></p>';
if(q.r)body+='<div>'+q.r+'</div>';body+='</div>'});
a.innerHTML='<div class="bar"><b>'+esc(C.title)+'</b><span class="sp"></span><span class="mut"><span id="cnt">0</span>/'+Q.length+' câu</span><span class="t" id="tm"></span><button id="sub">Nộp bài</button></div><div class="wrap"><div class="card"><b>'+esc(S.name)+(S.cls?' · '+esc(S.cls):'')+'</b> · Mã đề '+(S.seed%900+100)+'<div class="nav">'+nav+'</div></div>'+body+'<div class="card"><button id="sub2">Nộp bài</button></div></div>';
typeset();restore();bind();tick();$('#sub').onclick=$('#sub2').onclick=function(){submit(false)}}
function qsel(){return document.querySelectorAll('.opt[data-q],.yn,input.sh')}
function mark(){var n=0;Q.forEach(function(q,i){var a=S.ans[i],ok=false;if(q.p===1)ok=a!=null;else if(q.p===2)ok=a&&a.some(function(x){return x});else ok=a&&String(a).trim()!=='';if(ok)n++;var e=$('#n'+i);if(e)e.classList.toggle('done',!!ok)});$('#cnt').textContent=n;return n}
function restore(){document.querySelectorAll('.opt[data-q]').forEach(function(e){var a=S.ans[e.dataset.q];e.classList.toggle('sel',a!=null&&String(a)===e.dataset.v)});
document.querySelectorAll('.yn').forEach(function(e){var a=S.ans[e.dataset.q];e.querySelectorAll('span').forEach(function(s){s.classList.toggle('sel',!!a&&a[+e.dataset.c]===s.dataset.v)})});
document.querySelectorAll('input.sh').forEach(function(e){var a=S.ans[e.dataset.q];if(a!=null)e.value=a});mark()}
function bind(){document.querySelectorAll('.opt[data-q]').forEach(function(e){e.onclick=function(){if(done)return;S.ans[e.dataset.q]=+e.dataset.v;save();restore()}});
document.querySelectorAll('.yn span').forEach(function(s){s.onclick=function(){if(done)return;var y=s.parentNode,q=y.dataset.q,a=S.ans[q]||[null,null,null,null];a[+y.dataset.c]=s.dataset.v;S.ans[q]=a;save();restore()}});
document.querySelectorAll('input.sh').forEach(function(e){e.oninput=function(){S.ans[e.dataset.q]=e.value;save();mark()}})}
function tick(){clearInterval(timer);var el=$('#tm');if(!C.minutes){el.textContent='';return}
function f(){var left=C.minutes*60-Math.floor((Date.now()-S.start)/1000);if(left<=0){el.textContent='00:00';submit(true);return}
el.textContent=('0'+Math.floor(left/60)).slice(-3)+':'+('0'+left%60).slice(-2);el.classList.toggle('low',left<=60)}f();timer=setInterval(f,1000)}
function grade(){var P=C.pts,sc=[0,0,0,0],cn=[0,0,0,0],tot=[0,0,0,0],det=[],cor={};
Q.forEach(function(q,i){var a=S.ans[i],ok=false,part=q.p;tot[part]++;
if(part===1){ok=a!=null&&H(C.salt+'|'+i+'|'+a+'|1')===q.k[a];if(ok){sc[1]+=P[0];cn[1]++}det.push(a!=null?'ABCD'[a]:'-')}
else if(part===2){var k=0;if(a)q.k.forEach(function(h,c){if(a[c]&&H(C.salt+'|'+i+'|'+c+'|'+a[c])===h)k++});sc[2]+=P[1][k];if(k===4)cn[2]++;ok=k===4;cor[i]=k;det.push(a?a.map(function(x){return x||'-'}).join(''):'----')}
else{ok=a!=null&&String(a).trim()!==''&&H(C.salt+'|'+i+'|'+canon(a))===q.k;if(ok){sc[3]+=P[2];cn[3]++}det.push(a?String(a).trim():'-')}
cor[i]=part===2?cor[i]||0:ok});
var total=sc[1]+sc[2]+sc[3];return {sc:sc,cn:cn,tot:tot,total:Math.round(total*100)/100,det:det,ok:cor}}
function fmt(x){return (Math.round(x*100)/100).toString().replace('.',',')}
function submit(auto){if(done)return;if(!auto){var left=Q.length-mark();if(left>0&&!confirm('Còn '+left+' câu chưa làm. Bạn vẫn muốn nộp bài?'))return}
done=true;clearInterval(timer);S.done=true;S.end=Date.now();var g=grade();S.res={total:g.total,sc:g.sc};save();send(g);showResult(g,auto)}
function send(g){if(!C.gas)return;var p={sid:S.sid||newId(),name:S.name,className:S.cls,key:norm(S.name)+'|'+norm(S.cls),quiz:C.title,made:String(S.seed%900+100),seed:String(S.seed),score:fmt(g.total).replace(',','.'),
p1:g.sc[1].toFixed(2),p2:g.sc[2].toFixed(2),p3:g.sc[3].toFixed(2),seconds:String(Math.round((S.end-S.start)/1000)),detail:g.det.join('|')};setPend(p);flush()}
function showResult(g,auto){window.scrollTo(0,0);var o=order(S.seed);
var h='<div class="wrap"><div class="card res"><div class="mut">'+esc(S.name)+(S.cls?' · '+esc(S.cls):'')+' · Mã đề '+(S.seed%900+100)+(auto?' · Hết giờ, bài đã tự nộp':'')+'</div><div class="score">'+fmt(g.total)+' / 10</div><div class="grid">'
+[1,2,3].map(function(p){var mx=p===1?g.tot[1]*C.pts[0]:p===2?g.tot[2]*1:g.tot[3]*C.pts[2];return '<div>Phần '+['','I','II','III'][p]+'<b>'+fmt(g.sc[p])+' / '+fmt(mx)+'</b><span class="mut">'+g.cn[p]+'/'+g.tot[p]+' câu đúng hoàn toàn</span></div>'}).join('')
+'</div><p id="sent" class="mut">'+(C.gas?(pend()?'Đang gửi điểm…':'Đã gửi điểm cho thầy cô.'):'')+'</p><p><button id="again" class="sec">Làm lại (đề trộn mới)</button> <button id="cp" class="sec">Sao chép kết quả</button></p>';
if(C.locked)h+='<div id="lk"><label>Mật khẩu xem đáp án và lời giải (do thầy cô cung cấp)</label><input type="text" id="pw" style="max-width:260px"> <button id="unl">Mở</button><div id="pwe" class="msg err hide">Mật khẩu chưa đúng.</div></div>';
h+='</div><div id="review"></div></div>';$('#app').innerHTML=h;
$('#again').onclick=function(){S=null;try{localStorage.removeItem(KEY)}catch(e){}home()};
$('#cp').onclick=function(){var t=S.name+' - '+S.cls+' - Mã đề '+(S.seed%900+100)+': '+fmt(g.total)+'/10 (I: '+fmt(g.sc[1])+', II: '+fmt(g.sc[2])+', III: '+fmt(g.sc[3])+')';try{navigator.clipboard.writeText(t);this.textContent='Đã sao chép'}catch(e){prompt('Sao chép:',t)}};
if(C.locked){$('#unl').onclick=function(){var p=$('#pw').value;var r=unseal(D.rv,p);if(r&&H('pw|'+p)===C.pwcheck){RV=r;pwok=true;$('#lk').classList.add('hide');review(g,o)}else $('#pwe').classList.remove('hide')}}
else{RV=unseal(D.rv,'');review(g,o)}
if(!C.locked||pwok)typeset();else reviewBasic(g,o)}
function reviewBasic(g,o){review(g,o)}
function review(g,o){var h='<h2>Xem lại bài làm</h2>',cur=0,lastp=0;
o.ord.forEach(function(qi){var q=Q[qi],a=S.ans[qi],okq=q.p===2?g.ok[qi]===4:g.ok[qi];cur++;var rv=RV?RV[qi]:null;
h+='<div class="card rev '+(okq?'ok':'no')+'"><div><span class="qn">Câu '+cur+'.</span> '+(okq?'✓ Đúng':(q.p===2&&g.ok[qi]>0?'◐ Đúng '+g.ok[qi]+'/4 ý':'✗ Chưa đúng'))+'</div><div>'+q.s+'</div>';
if(q.p===1){o.co[qi].forEach(function(ci,j){var cl='opt';if(a===ci)cl+=' wrong';if(rv&&rv.a==='ABCD'[ci])cl='opt right';h+='<div class="'+cl+'"><span class="l">'+'ABCD'[j]+'.</span><span class="x">'+q.c[ci]+'</span></div>'});if(rv)h+='<div class="mut">Đáp án đúng: '+esc(rv.a.split('').map(function(L){return 'ABCD'[o.co[qi].indexOf('ABCD'.indexOf(L))]}).join(''))+'</div>'}
else if(q.p===2){o.co[qi].forEach(function(ci,j){var mine=a&&a[ci]||'-',line='<b>'+'abcd'[j]+')</b> '+q.c[ci]+'<div class="mut">Bạn chọn: '+(mine==='Đ'?'Đúng':mine==='S'?'Sai':'chưa chọn')+(rv?' · Đáp án: '+(rv.a[ci]==='Đ'?'Đúng':'Sai'):'')+'</div>';h+='<div class="tf"><div>'+line+'</div></div>'})}
else{h+='<p>Bạn trả lời: <b>'+esc(a||'(bỏ trống)')+'</b>'+(rv?' · Đáp án: <b>'+esc(rv.a)+'</b>':'')+'</p>'}
if(q.r)h+='<div>'+q.r+'</div>';if(rv&&rv.l)h+='<div class="sol"><b>Lời giải.</b> '+rv.l+'</div>';h+='</div>'});
$('#review').innerHTML=h;typeset($('#review'))}
var st=load();if(st&&st.done&&st.res){S=st;done=true;var g=grade();showResult(g,false)}else home();if(pend())flush();
})();
</script></body></html>
